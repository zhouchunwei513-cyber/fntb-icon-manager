name: Build FPK Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download fnpack
        run: |
          wget -q https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -O fnpack
          chmod +x fnpack

      - name: Build FPK
        run: |
          ./fnpack build
          ls -la *.fpk

      - name: Rename FPK with version
        run: |
          # v2.15.0: 产物名改为 fntb-icon-manager + 版本号（用户要求）
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          mv com.fntb.iconmgr.fpk "fntb-icon-manager_v${VER}.fpk"
          ls -la *.fpk

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          files: "fntb-icon-manager_v*.fpk"
          name: "${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
